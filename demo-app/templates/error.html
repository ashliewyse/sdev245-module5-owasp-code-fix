{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <section class="error-page" aria-labelledby="error-heading">
    <p class="error-code">{{ code }}</p><p class="eyebrow">Access Lab</p><h1 id="error-heading">{{ title }}</h1><p class="lead">{{ message }}</p>
    <div class="actions"><a class="button" href="{{ url_for('home') }}">Back to overview <span aria-hidden="true">→</span></a>{% if g.user %}<a class="text-link" href="{{ url_for('profile', user_id=g.user['id']) }}">Open my profile</a>{% else %}<a class="text-link" href="{{ url_for('login') }}">Log in</a>{% endif %}</div>
  </section>
{% endblock %}
